# nginx — mode "frontend seul" (visualisation UI sans backend ni DB).
# Surcharge la config baked (default.conf) qui, elle, proxifie /api vers chorus-api.
# Ici : pas de backend -> /health répond localement, /api renvoie un stub 503.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 80m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health local (le HEALTHCHECK du conteneur tape /health).
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"frontend-only"}';
    }

    # Pas de backend en mode frontend-only : stub explicite.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"backend indisponible (mode frontend-only). Lancez la stack complete: docker compose up -d --build"}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA : tout le reste retombe sur index.html (React Router).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

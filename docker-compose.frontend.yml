# Stack "frontend seul" — pour visualiser l'UI rapidement, sans DB ni backend.
#
#   docker compose -f docker-compose.frontend.yml up -d --build
#   -> http://localhost:8081   (ou ${APP_HTTP_PORT})
#
# Les appels /api renvoient un stub 503 (voir docker/nginx/frontend-only.conf).
# Pour l'app complète (avec backend + DB) : docker compose up -d --build
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CHORUS_ENV: ${VITE_CHORUS_ENV:-qualif}
        VITE_SHOW_DEV_TOOLS: ${VITE_SHOW_DEV_TOOLS:-true}
        VITE_DATA_API_BASE_URL: /api/db
        VITE_REFERENCE_API_BASE_URL: /api/db
        VITE_CHORUS_SUBMISSION_BRIDGE_URL: /api/chorus/submit
    ports:
      - "${APP_HTTP_PORT:-8081}:80"
    # Surcharge la config nginx baked pour fonctionner sans backend.
    volumes:
      - ./docker/nginx/frontend-only.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

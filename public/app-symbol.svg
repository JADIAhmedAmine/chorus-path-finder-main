<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="GIGALIS FAST CHORUS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F4F"/>
      <stop offset="1" stop-color="#172F63"/>
    </linearGradient>

    <linearGradient id="flow" x1="12" y1="48" x2="50" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29C27A"/>
      <stop offset="0.55" stop-color="#19E58D"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="docShade" x1="18" y1="13" x2="45" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Speed lines -->
  <g opacity="0.95" stroke="#22D3EE" stroke-width="3" stroke-linecap="round">
    <path d="M8 23h13"/>
    <path d="M5 30h18"/>
    <path d="M10 37h12"/>
  </g>
  <circle cx="5.5" cy="23" r="1.8" fill="#22D3EE"/>

  <!-- Invoice document -->
  <g filter="url(#softShadow)">
    <path d="M21 12h18l8 8v29a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="url(#docShade)"/>
    <path d="M39 12v8h8" fill="#DCEBFF"/>
    <path d="M39 20c2.8.4 5.4.3 8 0l-8-8v8z" fill="#CFE3FF" opacity="0.85"/>

    <!-- Document text lines -->
    <path d="M25 28h16M25 35h12" stroke="#172F63" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Automation/API flow -->
  <path d="M14 47c7.5 0 9.5-13 18-13h14" fill="none" stroke="#061C3D" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <path d="M14 47c7.5 0 9.5-13 18-13h14" fill="none" stroke="url(#flow)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="14" cy="47" r="6.5" fill="#22C55E"/>
  <path d="M10.8 46.7l2.2 2.3 4.4-5" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="33.5" cy="34" r="4.8" fill="#22D3EE"/>
  <circle cx="33.5" cy="34" r="2" fill="#172F63"/>

  <circle cx="46" cy="34" r="4.4" fill="#29C27A"/>
  <circle cx="46" cy="34" r="1.8" fill="#FFFFFF"/>

  <!-- Tiny API brackets -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M24 44l-2 2 2 2"/>
    <path d="M31 44l2 2-2 2"/>
    <path d="M28.8 43.7l-2.2 4.8"/>
  </g>
</svg>
